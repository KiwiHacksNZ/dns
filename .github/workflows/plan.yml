name: DNS plan

# Runs on every pull request that touches DNS. Read only: it never writes to
# Cloudflare. The record diff is posted as a comment on the PR so a reviewer can
# see exactly what would change before anything is merged.

on:
  pull_request:
    paths:
      - 'config/**'
      - 'config.yaml'
      - 'requirements.txt'
      - '.github/workflows/plan.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install octoDNS
        run: pip install -r requirements.txt

      - name: Validate config
        run: octodns-validate --config-file ./config.yaml
        env:
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}

      - name: Plan
        id: plan
        env:
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
        run: |
          # octoDNS writes two plan outputs on two streams, see the
          # plan_outputs block in config.yaml. The readable log goes to stderr
          # and lands in this job log. The markdown table goes to stdout, which
          # we capture here for the PR comment.
          octodns-sync --config-file ./config.yaml > plan.md

      - name: Comment the plan on the PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const MARKER = '<!-- octodns-plan -->';

            let plan = '';
            try {
              plan = fs.readFileSync('plan.md', 'utf8').trim();
            } catch (e) {
              plan = '';
            }

            const failed = ${{ steps.plan.outcome == 'failure' }};

            let body;
            if (failed) {
              body = [
                MARKER,
                '### octoDNS plan failed',
                '',
                'The plan could not be produced, so there is nothing to review yet.',
                'Check the job log for the error. Nothing has been changed in Cloudflare.',
              ].join('\n');
            } else if (!plan) {
              body = [
                MARKER,
                '### octoDNS plan',
                '',
                'No changes were planned. Both zones already match this branch.',
              ].join('\n');
            } else {
              const max = 60000;
              const table = plan.length > max
                ? plan.slice(0, max) + '\n\n_[truncated, see the job log for the rest]_'
                : plan;
              body = [
                MARKER,
                '### octoDNS plan',
                '',
                table,
                '',
                '---',
                'Nothing has been changed in Cloudflare. Merging this PR applies the above.',
              ].join('\n');
            }

            // Update the existing plan comment rather than adding a new one on
            // every push, so a PR with several revisions stays readable.
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(MARKER));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }
