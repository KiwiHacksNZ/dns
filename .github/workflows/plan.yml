name: DNS plan

# Runs on every pull request that touches DNS. Read only: it never writes to
# Cloudflare. The diff is posted as a comment on the PR so a reviewer can see
# exactly which records would change before anything is merged.

on:
  pull_request:
    paths:
      - 'config/**'
      - 'config.yaml'
      - 'requirements.txt'
      - '.github/workflows/plan.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install octoDNS
        run: pip install -r requirements.txt

      - name: Validate config
        run: octodns-validate --config-file ./config.yaml
        env:
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}

      - name: Plan
        id: plan
        env:
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
        run: |
          set -o pipefail
          octodns-sync --config-file ./config.yaml 2>&1 | tee plan.txt

      - name: Comment the plan on the PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '';
            try {
              body = fs.readFileSync('plan.txt', 'utf8');
            } catch (e) {
              body = 'The plan step produced no output. Check the job log.';
            }
            const max = 60000;
            if (body.length > max) {
              body = body.slice(0, max) + '\n\n[truncated, see the job log for the rest]';
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '### octoDNS plan\n\n```\n' + body + '\n```\n\nNothing has been changed in Cloudflare. Merging this PR applies it.',
            });
